<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle with Dark Glass Background -->
  <rect width="512" height="512" rx="128" fill="#0f1115" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" opacity="0.95" filter="url(#shadow)" />

  <!-- Video Camera & Collaboration Emblem -->
  <g transform="translate(96, 128)" fill="none" stroke="url(#accent-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Camera Body -->
    <rect x="16" y="32" width="180" height="192" rx="36" fill="#0f172a" fill-opacity="0.3" stroke="url(#accent-grad)" />
    <!-- Camera Lens Cone -->
    <polygon points="196,88 288,40 288,216 196,168" fill="#0f172a" fill-opacity="0.3" stroke="url(#accent-grad)" />
    <!-- Center Audio/Video Wave Pulse -->
    <circle cx="106" cy="128" r="32" fill="#38bdf8" stroke="none" />
  </g>
</svg>
