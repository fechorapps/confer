apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "confer.fullname" . }}
  labels:
    {{- include "confer.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "confer.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.podAnnotations | nindent 8 }}
      labels:
        {{- include "confer.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ .Values.config.environment | quote }}
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: ConnectionStrings__Postgres
              value: "Host={{ .Values.postgresql.host }};Port={{ .Values.postgresql.port }};Database={{ .Values.postgresql.database }};Username={{ .Values.postgresql.username }};Password={{ .Values.postgresql.password }}"
            - name: ConnectionStrings__Redis
              value: "{{ .Values.redis.host }}:{{ .Values.redis.port }}"
            - name: Jwt__SecretKey
              value: {{ .Values.config.jwtSecret | quote }}
            - name: Jwt__Issuer
              value: {{ .Values.config.jwtIssuer | quote }}
            - name: Jwt__Audience
              value: {{ .Values.config.jwtAudience | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
