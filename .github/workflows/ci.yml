name: Confer CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # -------------------------------------------------------------
  # 1. Backend .NET 10 Test & Build Suite
  # -------------------------------------------------------------
  backend-test:
    name: Backend .NET 10 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/api/Api.csproj

      - name: Build Backend solution
        run: dotnet build --no-restore src/api/Api.csproj -c Release

      - name: Run automated test suite (157 unit & integration tests)
        run: dotnet test tests/Confer.Tests/Confer.Tests.csproj --no-build -c Release --verbosity normal

  # -------------------------------------------------------------
  # 2. Desktop Client Multi-Platform Build Matrix (Rust)
  # -------------------------------------------------------------
  desktop-matrix:
    name: Desktop Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux native audio/video headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libclang-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client-desktop

      - name: Cargo Typecheck
        run: cargo check --manifest-path client-desktop/Cargo.toml --target ${{ matrix.target }}

      - name: Cargo Clippy
        run: cargo clippy --manifest-path client-desktop/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings

      - name: Run Rust unit tests
        if: runner.os == 'Linux'
        run: cargo test --manifest-path client-desktop/Cargo.toml
